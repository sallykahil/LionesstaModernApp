<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lionessta Admin</title>

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg:       #F7EFE3;
            --surface: rgba(58,36,22,.05);
            --surface-hover: rgba(58,36,22,.09);
            --border:   rgba(58,36,22,.18);
            --border-strong: #3A2416;
            --text:     #3A2416;
            --text-dim: rgba(58,36,22,.65);
            --text-faint: rgba(58,36,22,.42);
            --accent:   #C94F7C;
            --danger:   #B5473F;
            --success:  #3F7A52;
            --gradient-btn: linear-gradient(123deg, #2B0F1F 7%, #C94F7C 37%, #8B3A5E 72%, #E88AA8 100%);
            --gradient-heading: linear-gradient(180deg, #6B3B52 0%, #D4779C 100%);
        }

        body {
            font-family: 'Kanit', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .hero-heading { background: var(--gradient-heading); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

        /* ── LOGIN SCREEN ── */
        #login-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            padding: 0 1.5rem;
        }

        .login-box h1 {
            font-size: clamp(2.2rem, 8vw, 3.2rem);
            font-weight: 900;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: .2rem;
        }

        .login-box .subtitle {
            font-size: .78rem;
            color: var(--text-faint);
            margin-bottom: 2.4rem;
            letter-spacing: .18em;
            text-transform: uppercase;
            text-align: center;
        }

        /* ── FORM ELEMENTS ── */
        .field { margin-bottom: 1.3rem; }

        .field label {
            display: block;
            font-size: .7rem;
            letter-spacing: .16em;
            text-transform: uppercase;
            color: var(--text);
            font-weight: 500;
            margin-bottom: .5rem;
        }

        .field label .req { color: var(--danger); margin-left: .2rem; }

        .field input, .field select, .field textarea {
            width: 100%;
            padding: .78rem 1rem;
            border: 2px solid var(--border);
            border-radius: 14px;
            background: transparent;
            font-family: 'Kanit', sans-serif;
            font-size: .9rem;
            color: var(--text);
            outline: none;
            transition: border-color .25s;
        }

        .field textarea { resize: vertical; min-height: 70px; }

        .field input:focus, .field select:focus, .field textarea:focus {
            border-color: var(--border-strong);
        }

        .field select option { background: var(--bg); }

        .field-error { color: var(--danger); font-size: .78rem; margin-top: .4rem; }

        /* ── BUTTONS ── */
        .btn {
            padding: .9rem 1.6rem;
            background: var(--gradient-btn);
            box-shadow: 0px 4px 4px rgba(201,79,124,.25), 4px 4px 12px #8B3A5E inset;
            outline: 2px solid var(--border-strong);
            outline-offset: -3px;
            color: #fff;
            font-family: 'Kanit', sans-serif;
            font-size: .78rem;
            letter-spacing: .12em;
            text-transform: uppercase;
            font-weight: 500;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: transform .2s;
        }

        .btn.full { width: 100%; }
        .btn:hover { transform: translateY(-1px) scale(1.01); }
        .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

        .btn-ghost {
            background: transparent;
            box-shadow: none;
            outline: 2px solid var(--border-strong);
            outline-offset: -2px;
            color: var(--text);
            padding: .55rem 1.2rem;
            font-size: .7rem;
        }
        .btn-ghost:hover { background: var(--surface-hover); transform: translateY(-1px); }

        .btn-danger-ghost {
            background: transparent;
            box-shadow: none;
            outline: 2px solid var(--danger);
            outline-offset: -2px;
            color: var(--danger);
            padding: .5rem;
            width: 34px; height: 34px;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-danger-ghost:hover { background: rgba(181,71,63,.1); }

        .icon-btn {
            width: 34px; height: 34px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            background: transparent;
            outline: 2px solid var(--border-strong);
            outline-offset: -2px;
            color: var(--text);
            border: none;
            cursor: pointer;
            font-size: .85rem;
            transition: background .2s;
        }
        .icon-btn:hover { background: var(--surface-hover); }

        /* ── TOAST ── */
        #toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: .9rem 1.6rem;
            font-size: .8rem;
            letter-spacing: .04em;
            color: var(--text);
            border-radius: 14px;
            border: 2px solid var(--border-strong);
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s, transform .3s;
            transform: translateY(10px);
            z-index: 10000;
            background: var(--bg);
        }

        #toast.show { opacity: 1; transform: none; }
        #toast.success { border-color: var(--success); color: var(--success); }
        #toast.error   { border-color: var(--danger); color: var(--danger); }

        /* ── DASHBOARD ── */
        #dashboard { display: none; }

        .topbar {
            padding: 1.4rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .topbar-brand {
            font-size: 1.3rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: .02em;
        }

        .topbar-brand span { color: var(--accent); }

        .tabs {
            display: flex;
            align-items: center;
            gap: 4px;
            border: 2px solid var(--border);
            border-radius: 9999px;
            padding: 4px;
        }

        .tab-btn {
            padding: .5rem 1.2rem;
            border-radius: 9999px;
            border: none;
            background: transparent;
            color: var(--text);
            font-family: 'Kanit', sans-serif;
            font-size: .75rem;
            letter-spacing: .1em;
            text-transform: uppercase;
            font-weight: 500;
            cursor: pointer;
            transition: background .2s, color .2s;
        }
        .tab-btn.active { background: var(--text); color: var(--bg); }
        .tab-btn:not(.active):hover { background: var(--surface-hover); }

        .logout-btn {
            font-size: .72rem;
            letter-spacing: .12em;
            text-transform: uppercase;
            font-weight: 500;
            color: var(--text-dim);
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: .4rem;
            transition: color .2s;
        }
        .logout-btn:hover { color: var(--text); }

        /* ── DASHBOARD BODY ── */
        .dashboard-body {
            padding: 2.5rem 2rem 4rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .panel-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .panel-head h2 {
            font-size: clamp(1.6rem, 4vw, 2.4rem);
            font-weight: 900;
            text-transform: uppercase;
        }

        .empty-hint { color: var(--text-dim); font-size: .85rem; margin-bottom: 1.5rem; }

        /* ── CATEGORY GRID ── */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.2rem;
        }

        .category-card {
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 1.4rem;
            display: flex;
            flex-direction: column;
            gap: .6rem;
        }

        .category-card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: .6rem;
        }

        .category-card h3 { font-size: 1.1rem; font-weight: 500; text-transform: uppercase; }
        .category-card .slug { font-size: .68rem; color: var(--text-faint); text-transform: uppercase; letter-spacing: .08em; }
        .category-card .desc { font-size: .82rem; color: var(--text-dim); line-height: 1.5; flex: 1; }
        .category-card .count { font-size: .7rem; color: var(--text-faint); text-transform: uppercase; letter-spacing: .08em; margin-top: auto; padding-top: .4rem; }
        .category-card-actions { display: flex; gap: .4rem; flex-shrink: 0; }

        /* ── PRODUCT GRID ── */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.2rem;
        }

        .product-card {
            border: 2px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .product-card img { width: 100%; aspect-ratio: 4/5; object-fit: cover; display: block; }

        .product-card-body {
            padding: .9rem 1rem 1.1rem;
            display: flex;
            flex-direction: column;
            gap: .3rem;
            flex: 1;
        }

        .product-card-body .cat-row { display: flex; align-items: center; justify-content: space-between; gap: .4rem; }
        .product-card-body .cat { font-size: .62rem; color: var(--text-faint); text-transform: uppercase; letter-spacing: .1em; }
        /* Shown so the admin can match a WhatsApp order's "[ID: 42]" back to the
           exact product -- several listings can share the same name (e.g. two
           products both called "brown bag"), so the name alone isn't reliable. */
        .product-card-body .product-id { font-size: .62rem; color: var(--text-faint); font-family: monospace; flex-shrink: 0; }
        .product-card-body .name { font-size: .82rem; font-weight: 500; text-transform: uppercase; line-height: 1.3; }
        .product-card-body .price { font-size: 1.1rem; font-weight: 800; margin-top: auto; padding-top: .3rem; }
        .product-card-actions { display: flex; gap: .4rem; padding-top: .5rem; }

        .loading-state, .no-items-state {
            grid-column: 1/-1;
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-faint);
            font-size: .85rem;
        }

        /* ── MODAL ── */
        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(36,23,18,.85);
            backdrop-filter: blur(6px);
            z-index: 9000;
            align-items: flex-start;
            justify-content: center;
            padding: 4rem 1.5rem;
            overflow-y: auto;
        }
        .modal-backdrop.open { display: flex; }

        .modal-box {
            width: 100%;
            max-width: 460px;
            border: 2px solid var(--border-strong);
            border-radius: 32px;
            background: var(--bg);
            padding: 2rem;
        }

        .modal-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.6rem;
        }

        .modal-head h3 { font-size: 1.4rem; font-weight: 900; text-transform: uppercase; }

        .modal-body p.confirm-msg { color: var(--text-dim); font-size: .9rem; line-height: 1.6; margin-bottom: 1.6rem; }
        .modal-actions { display: flex; justify-content: center; gap: .8rem; margin-top: .4rem; }

        /* ── UPLOAD FILE INPUT ── */
        .file-field {
            display: flex;
            align-items: center;
            gap: .8rem;
        }
        .file-preview {
            width: 64px; height: 64px;
            border-radius: 14px;
            object-fit: cover;
            border: 2px solid var(--border);
            flex-shrink: 0;
            display: none;
        }
        .file-label {
            flex: 1;
            border: 2px dashed var(--border);
            border-radius: 14px;
            padding: .8rem 1rem;
            text-align: center;
            font-size: .8rem;
            color: var(--text-dim);
            cursor: pointer;
            transition: border-color .2s;
        }
        .file-label:hover { border-color: var(--border-strong); }

        @media(max-width:640px) {
            .topbar { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <div id="toast"></div>

    <!-- ── LOGIN ── -->
    <div id="login-screen">
        <div class="login-box">
            <h1 class="hero-heading">Lionessta</h1>
            <p class="subtitle">Admin panel</p>
            <div class="field">
                <label>Username</label>
                <input type="text" id="username" autocomplete="username" />
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" id="password" autocomplete="current-password"
                       onkeydown="if(event.key==='Enter') doLogin()" />
            </div>
            <button class="btn full" onclick="doLogin()" id="login-btn">Sign In</button>
        </div>
    </div>

    <!-- ── DASHBOARD ── -->
    <div id="dashboard">

        <div class="topbar">
            <span class="topbar-brand"><span>L</span>ionessta Admin</span>
            <div class="tabs">
                <button class="tab-btn active" id="tab-products" onclick="switchTab('products')">Products</button>
                <button class="tab-btn" id="tab-categories" onclick="switchTab('categories')">Categories</button>
            </div>
            <button class="logout-btn" onclick="doLogout()">⏻ Log Out</button>
        </div>

        <div class="dashboard-body">

            <!-- PRODUCTS PANEL -->
            <div id="panel-products">
                <div class="panel-head">
                    <h2 class="hero-heading">Products</h2>
                    <button class="btn" onclick="openProductModal()">Add Product</button>
                </div>
                <p class="empty-hint" id="products-hint" style="display:none;">Add a category first — every product needs one.</p>
                <div class="product-grid" id="product-grid">
                    <div class="loading-state">Loading…</div>
                </div>
            </div>

            <!-- CATEGORIES PANEL -->
            <div id="panel-categories" style="display:none;">
                <div class="panel-head">
                    <h2 class="hero-heading">Categories</h2>
                    <button class="btn" onclick="openCategoryModal()">Add Category</button>
                </div>
                <div class="category-grid" id="category-grid">
                    <div class="loading-state">Loading…</div>
                </div>
            </div>

        </div>
    </div>

    <!-- ── CATEGORY MODAL ── -->
    <div class="modal-backdrop" id="category-modal-backdrop">
        <div class="modal-box">
            <div class="modal-head">
                <h3 id="category-modal-title" class="hero-heading">New Category</h3>
                <button class="icon-btn" onclick="closeCategoryModal()">✕</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="cat-edit-id" />
                <div class="field">
                    <label>Name<span class="req">*</span></label>
                    <input type="text" id="cat-name" placeholder="Amigurumi" oninput="onCategoryNameInput()" />
                </div>
                <div class="field">
                    <label>Slug<span class="req">*</span></label>
                    <input type="text" id="cat-slug" placeholder="amigurumi" oninput="catSlugTouched = true" />
                </div>
                <div class="field">
                    <label>Description</label>
                    <textarea id="cat-description" placeholder="Tiny hand-stitched characters and creatures…"></textarea>
                </div>
                <p class="field-error" id="cat-error" style="display:none;"></p>
                <div class="modal-actions">
                    <button class="btn" id="cat-save-btn" onclick="saveCategory()">Create Category</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ── PRODUCT MODAL ── -->
    <div class="modal-backdrop" id="product-modal-backdrop">
        <div class="modal-box">
            <div class="modal-head">
                <h3 id="product-modal-title" class="hero-heading">New Product</h3>
                <button class="icon-btn" onclick="closeProductModal()">✕</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="prod-edit-id" />
                <div class="field" id="prod-file-field">
                    <label>Photo<span class="req" id="prod-file-req">*</span></label>
                    <div class="file-field">
                        <img id="prod-file-preview" class="file-preview" src="" alt="" />
                        <label class="file-label" for="prod-file" id="prod-file-label">Choose a photo…</label>
                        <input type="file" id="prod-file" accept="image/jpeg,image/png,image/webp" style="display:none;" onchange="onProductFileChange(this.files[0])" />
                    </div>
                    <p class="field-error" id="prod-edit-photo-note" style="display:none;color:var(--text-faint);">To change the photo, delete this product and add it again.</p>
                </div>
                <div class="field">
                    <label>Name<span class="req">*</span></label>
                    <input type="text" id="prod-label" placeholder="Sunset Amigurumi Fox" />
                </div>
                <div class="field">
                    <label>Category<span class="req">*</span></label>
                    <select id="prod-category"></select>
                </div>
                <div class="field">
                    <label>Price (USD)<span class="req">*</span></label>
                    <input type="number" id="prod-price" min="0" step="0.01" placeholder="28.00" />
                </div>
                <div class="field">
                    <label>Description</label>
                    <textarea id="prod-description" placeholder="A hand-stitched fox, worked stitch by stitch in soft cotton yarn."></textarea>
                </div>
                <p class="field-error" id="prod-error" style="display:none;"></p>
                <div class="modal-actions">
                    <button class="btn" id="prod-save-btn" onclick="saveProduct()">Add Product</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ── CONFIRM DELETE MODAL ── -->
    <div class="modal-backdrop" id="confirm-modal-backdrop">
        <div class="modal-box">
            <div class="modal-head">
                <h3 id="confirm-modal-title" class="hero-heading">Delete</h3>
                <button class="icon-btn" onclick="closeConfirmModal()">✕</button>
            </div>
            <div class="modal-body">
                <p class="confirm-msg" id="confirm-modal-msg"></p>
                <p class="field-error" id="confirm-error" style="display:none;"></p>
                <div class="modal-actions">
                    <button class="btn btn-ghost" onclick="closeConfirmModal()">Cancel</button>
                    <button class="btn" id="confirm-btn">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script>
  const API = '';

  let token = localStorage.getItem('lion_token') || '';
  let selectedFile = null;
  let allProducts = [];
  let allCategories = [];
  let catSlugTouched = false;
  let confirmAction = null;

  function toast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `show ${type}`;
    setTimeout(() => t.className = '', 3000);
  }

  function formatPrice(price) {
    return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(price || 0);
  }

  function slugify(v) {
    return v.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
  }

  async function api(path, options = {}) {
    const headers = options.headers || {};
    if (options.auth) headers['Authorization'] = `Bearer ${token}`;
    const res = await fetch(`${API}${path}`, { ...options, headers });
    if (!res.ok) {
      // A 401 on an authenticated call means the stored token expired (login
      // tokens last 8h) or is otherwise no longer valid -- the dashboard trusts
      // whatever token is in localStorage without checking it on load, so this
      // is the only point where we find out. Force a clean re-login instead of
      // surfacing a confusing raw "Request failed (401)" on every write action.
      if (res.status === 401 && options.auth) {
        doLogout();
        toast('Your session expired -- please sign in again.', 'error');
        throw new Error('Session expired. Please sign in again.');
      }
      let message = `Request failed (${res.status}).`;
      try { const body = await res.json(); if (body?.message) message = body.message; } catch {}
      throw new Error(message);
    }
    if (res.status === 204) return null;
    return res.json();
  }

  window.addEventListener('load', () => {
    if (token) showDashboard();
  });

  /* ── AUTH ── */
  async function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    if (!username || !password) { toast('Enter username and password', 'error'); return; }

    const btn = document.getElementById('login-btn');
    btn.disabled = true; btn.textContent = 'Signing in…';

    try {
      const data = await api('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      token = data.token;
      localStorage.setItem('lion_token', token);
      showDashboard();
    } catch (err) {
      toast(err.message || 'Login failed', 'error');
    } finally {
      btn.disabled = false; btn.textContent = 'Sign In';
    }
  }

  function doLogout() {
    token = '';
    localStorage.removeItem('lion_token');
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
    // Modals live outside #dashboard in the DOM, so hiding the dashboard alone
    // leaves one stranded on top of the login screen if a session expires
    // while it's open (e.g. the 401 handler above calling this mid-request).
    document.querySelectorAll('.modal-backdrop.open').forEach(m => m.classList.remove('open'));
  }

  function showDashboard() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadAll();
  }

  /* ── TABS ── */
  function switchTab(tab) {
    document.getElementById('tab-products').classList.toggle('active', tab === 'products');
    document.getElementById('tab-categories').classList.toggle('active', tab === 'categories');
    document.getElementById('panel-products').style.display = tab === 'products' ? 'block' : 'none';
    document.getElementById('panel-categories').style.display = tab === 'categories' ? 'block' : 'none';
  }

  /* ── LOAD DATA ── */
  async function loadAll() {
    document.getElementById('product-grid').innerHTML = '<div class="loading-state">Loading…</div>';
    document.getElementById('category-grid').innerHTML = '<div class="loading-state">Loading…</div>';
    try {
      const [cats, prods] = await Promise.all([
        api('/api/categories'),
        api('/api/images'),
      ]);
      allCategories = cats;
      allProducts = prods;
      renderCategoryGrid();
      renderProductGrid();
    } catch (err) {
      if (err.message.includes('401')) { toast('Session expired — please log in again', 'error'); doLogout(); return; }
      document.getElementById('product-grid').innerHTML = '<div class="loading-state">Could not load data.</div>';
      document.getElementById('category-grid').innerHTML = '<div class="loading-state">Could not load data.</div>';
    }
  }

  /* ── CATEGORY GRID ── */
  function renderCategoryGrid() {
    const grid = document.getElementById('category-grid');
    if (allCategories.length === 0) {
      grid.innerHTML = '<div class="no-items-state">No categories yet. Products need a category before they can be added, so start here.</div>';
      return;
    }
    grid.innerHTML = allCategories.map(c => `
      <div class="category-card">
        <div class="category-card-top">
          <h3>${c.name}</h3>
          <div class="category-card-actions">
            <button class="icon-btn" title="Edit" onclick="openCategoryModal(${c.id})">✎</button>
            <button class="btn-danger-ghost" title="Delete" onclick="confirmDeleteCategory(${c.id})">✕</button>
          </div>
        </div>
        <span class="slug">/${c.slug}</span>
        ${c.description ? `<p class="desc">${c.description}</p>` : ''}
        <span class="count">${c.productCount} product${c.productCount === 1 ? '' : 's'}</span>
      </div>`).join('');
  }

  /* ── PRODUCT GRID ── */
  function renderProductGrid() {
    const grid = document.getElementById('product-grid');
    const hint = document.getElementById('products-hint');
    hint.style.display = allCategories.length === 0 ? 'block' : 'none';

    if (allProducts.length === 0) {
      grid.innerHTML = '<div class="no-items-state">No products yet.</div>';
      return;
    }
    grid.innerHTML = allProducts.map(p => `
      <div class="product-card">
        <img src="${p.imageUrl}" alt="${p.label}" loading="lazy" />
        <div class="product-card-body">
          <div class="cat-row">
            <span class="cat">${p.categoryName}</span>
            <span class="product-id">#${p.id}</span>
          </div>
          <span class="name">${p.label}</span>
          <span class="price hero-heading">${formatPrice(p.price)}</span>
          <div class="product-card-actions">
            <button class="icon-btn" title="Edit" onclick="openProductModal(${p.id})">✎</button>
            <button class="btn-danger-ghost" title="Delete" onclick="confirmDeleteProduct(${p.id})">✕</button>
          </div>
        </div>
      </div>`).join('');
  }

  /* ── CATEGORY MODAL ── */
  function openCategoryModal(id) {
    const cat = id ? allCategories.find(c => c.id === id) : null;
    document.getElementById('category-modal-title').textContent = cat ? 'Edit Category' : 'New Category';
    document.getElementById('cat-save-btn').textContent = cat ? 'Save Changes' : 'Create Category';
    document.getElementById('cat-edit-id').value = cat ? cat.id : '';
    document.getElementById('cat-name').value = cat ? cat.name : '';
    document.getElementById('cat-slug').value = cat ? cat.slug : '';
    document.getElementById('cat-description').value = cat ? (cat.description || '') : '';
    document.getElementById('cat-error').style.display = 'none';
    catSlugTouched = !!cat;
    document.getElementById('category-modal-backdrop').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeCategoryModal() {
    document.getElementById('category-modal-backdrop').classList.remove('open');
    document.body.style.overflow = '';
  }

  function onCategoryNameInput() {
    if (catSlugTouched) return;
    document.getElementById('cat-slug').value = slugify(document.getElementById('cat-name').value);
  }

  async function saveCategory() {
    const id = document.getElementById('cat-edit-id').value;
    const name = document.getElementById('cat-name').value.trim();
    const slug = slugify(document.getElementById('cat-slug').value);
    const description = document.getElementById('cat-description').value.trim();
    const errorEl = document.getElementById('cat-error');
    errorEl.style.display = 'none';

    if (!name || !slug) { errorEl.textContent = 'Name and slug are required.'; errorEl.style.display = 'block'; return; }

    const btn = document.getElementById('cat-save-btn');
    btn.disabled = true;
    try {
      if (id) {
        await api(`/api/categories/${id}`, {
          method: 'PUT', auth: true,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, slug, description }),
        });
      } else {
        await api('/api/categories', {
          method: 'POST', auth: true,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, slug, description }),
        });
      }
      toast(id ? 'Category updated' : 'Category created');
      closeCategoryModal();
      loadAll();
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.style.display = 'block';
    } finally {
      btn.disabled = false;
    }
  }

  function confirmDeleteCategory(id) {
    const cat = allCategories.find(c => c.id === id);
    if (!cat) return;
    document.getElementById('confirm-modal-title').textContent = 'Delete Category';
    document.getElementById('confirm-modal-msg').textContent =
      `Delete "${cat.name}"? This can't be undone. Categories that still have products can't be deleted.`;
    document.getElementById('confirm-error').style.display = 'none';
    confirmAction = async () => {
      await api(`/api/categories/${id}`, { method: 'DELETE', auth: true });
      toast('Category deleted');
      loadAll();
    };
    document.getElementById('confirm-modal-backdrop').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  /* ── PRODUCT MODAL ── */
  function populateCategorySelect(selectedId) {
    const select = document.getElementById('prod-category');
    if (allCategories.length === 0) {
      select.innerHTML = '<option value="">No categories yet</option>';
      return;
    }
    select.innerHTML = allCategories.map(c =>
      `<option value="${c.id}" ${String(c.id) === String(selectedId) ? 'selected' : ''}>${c.name}</option>`
    ).join('');
  }

  function openProductModal(id) {
    const prod = id ? allProducts.find(p => p.id === id) : null;
    selectedFile = null;
    document.getElementById('product-modal-title').textContent = prod ? 'Edit Product' : 'New Product';
    document.getElementById('prod-save-btn').textContent = prod ? 'Save Changes' : 'Add Product';
    document.getElementById('prod-edit-id').value = prod ? prod.id : '';
    document.getElementById('prod-label').value = prod ? prod.label : '';
    document.getElementById('prod-price').value = prod ? prod.price : '';
    document.getElementById('prod-description').value = prod ? (prod.description || '') : '';
    document.getElementById('prod-error').style.display = 'none';
    document.getElementById('prod-file').value = '';
    document.getElementById('prod-file').disabled = !!prod;
    document.getElementById('prod-file-req').style.display = prod ? 'none' : 'inline';
    document.getElementById('prod-edit-photo-note').style.display = prod ? 'block' : 'none';
    document.getElementById('prod-file-label').textContent = prod ? 'Replace photo (not supported here)' : 'Choose a photo…';

    const preview = document.getElementById('prod-file-preview');
    if (prod) { preview.src = prod.imageUrl; preview.style.display = 'block'; }
    else { preview.src = ''; preview.style.display = 'none'; }

    populateCategorySelect(prod ? prod.categoryId : (allCategories[0] ? allCategories[0].id : ''));

    document.getElementById('product-modal-backdrop').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeProductModal() {
    document.getElementById('product-modal-backdrop').classList.remove('open');
    document.body.style.overflow = '';
  }

  function onProductFileChange(file) {
    if (!file) return;
    selectedFile = file;
    document.getElementById('prod-file-label').textContent = file.name;
    const reader = new FileReader();
    reader.onload = e => {
      const preview = document.getElementById('prod-file-preview');
      preview.src = e.target.result;
      preview.style.display = 'block';
    };
    reader.readAsDataURL(file);
  }

  async function saveProduct() {
    const id = document.getElementById('prod-edit-id').value;
    const label = document.getElementById('prod-label').value.trim();
    const categoryId = document.getElementById('prod-category').value;
    const price = document.getElementById('prod-price').value;
    const description = document.getElementById('prod-description').value.trim();
    const errorEl = document.getElementById('prod-error');
    errorEl.style.display = 'none';

    if (!label || !categoryId || !price) {
      errorEl.textContent = 'Name, category, and price are required.';
      errorEl.style.display = 'block';
      return;
    }
    if (!id && !selectedFile) {
      errorEl.textContent = 'Choose a photo for this product.';
      errorEl.style.display = 'block';
      return;
    }

    const btn = document.getElementById('prod-save-btn');
    btn.disabled = true;
    try {
      if (id) {
        await api(`/api/images/${id}`, {
          method: 'PUT', auth: true,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ label, categoryId: Number(categoryId), price: Number(price), description }),
        });
      } else {
        const form = new FormData();
        form.append('File', selectedFile);
        form.append('Label', label);
        form.append('CategoryId', categoryId);
        form.append('Price', price);
        if (description) form.append('Description', description);
        await api('/api/images/upload', { method: 'POST', auth: true, body: form });
      }
      toast(id ? 'Product updated' : 'Product added');
      closeProductModal();
      loadAll();
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.style.display = 'block';
    } finally {
      btn.disabled = false;
    }
  }

  function confirmDeleteProduct(id) {
    const prod = allProducts.find(p => p.id === id);
    if (!prod) return;
    document.getElementById('confirm-modal-title').textContent = 'Delete Product';
    document.getElementById('confirm-modal-msg').textContent =
      `Delete "${prod.label}"? This removes it from the store and deletes the photo. This can't be undone.`;
    document.getElementById('confirm-error').style.display = 'none';
    confirmAction = async () => {
      await api(`/api/images/${id}`, { method: 'DELETE', auth: true });
      toast('Product deleted');
      loadAll();
    };
    document.getElementById('confirm-modal-backdrop').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  /* ── CONFIRM MODAL ── */
  document.getElementById('confirm-btn').addEventListener('click', async () => {
    if (!confirmAction) return;
    const btn = document.getElementById('confirm-btn');
    const errorEl = document.getElementById('confirm-error');
    errorEl.style.display = 'none';
    btn.disabled = true;
    try {
      await confirmAction();
      closeConfirmModal();
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.style.display = 'block';
    } finally {
      btn.disabled = false;
    }
  });

  function closeConfirmModal() {
    document.getElementById('confirm-modal-backdrop').classList.remove('open');
    document.body.style.overflow = '';
    confirmAction = null;
  }

  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    closeCategoryModal();
    closeProductModal();
    closeConfirmModal();
  });
    </script>
</body>
</html>
